# =============================================================================
# NOVEX — Deploy Backend → Artifact Registry (novex) → Cloud Run
# =============================================================================
#
# Triggers: push a main | workflow_dispatch
# Imagen: {REGION}-docker.pkg.dev/{PROJECT}/novex/novex-backend:{sha7}
# Deploy: solo --image (preserva Cloud SQL, env, secretos novex-*).
#
# Vars: GCP_PROJECT_ID, GCP_REGION (req)
#       ARTIFACT_REGISTRY_REPOSITORY, BACKEND_IMAGE_NAME, CLOUD_RUN_SERVICE_BACKEND (opc)
# Secret: GCP_SERVICE_ACCOUNT_KEY
# =============================================================================

name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del deploy manual (auditoría)'
        required: false
        type: string

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        continue-on-error: true
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

  build-push-deploy:
    name: Build · Push · Deploy
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      service_url: ${{ steps.deploy.outputs.service_url }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      digest: ${{ steps.digest.outputs.fully_qualified_digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy metadata
        id: meta
        run: |
          set -euo pipefail

          PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"
          REGION="${{ vars.GCP_REGION }}"
          REPOSITORY="${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}"
          IMAGE_NAME="${{ vars.BACKEND_IMAGE_NAME }}"
          SERVICE_NAME="${{ vars.CLOUD_RUN_SERVICE_BACKEND }}"
          REASON="${{ github.event.inputs.reason || 'push' }}"

          if [[ -z "${PROJECT_ID}" ]]; then
            echo "::error::Falta variable de repositorio GCP_PROJECT_ID"
            exit 1
          fi
          if [[ -z "${REGION}" ]]; then
            echo "::error::Falta variable de repositorio GCP_REGION"
            exit 1
          fi

          REPOSITORY="${REPOSITORY:-novex}"
          IMAGE_NAME="${IMAGE_NAME:-novex-backend}"
          SERVICE_NAME="${SERVICE_NAME:-novex-backend}"

          SHORT_SHA="${GITHUB_SHA:0:7}"
          REGISTRY_HOST="${REGION}-docker.pkg.dev"
          IMAGE_URI="${REGISTRY_HOST}/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}"
          IMAGE_TAG="${IMAGE_URI}:${SHORT_SHA}"

          {
            echo "project_id=${PROJECT_ID}"
            echo "region=${REGION}"
            echo "repository=${REPOSITORY}"
            echo "image_name=${IMAGE_NAME}"
            echo "service_name=${SERVICE_NAME}"
            echo "short_sha=${SHORT_SHA}"
            echo "registry_host=${REGISTRY_HOST}"
            echo "image_uri=${IMAGE_URI}"
            echo "image_tag=${IMAGE_TAG}"
            echo "reason=${REASON}"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::Deploy reason=${REASON} image=${IMAGE_TAG} → ${SERVICE_NAME}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ steps.meta.outputs.project_id }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${{ steps.meta.outputs.registry_host }}" --quiet

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --tag "${{ steps.meta.outputs.image_tag }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "novex.component=backend" \
            --label "novex.git.sha=${{ steps.meta.outputs.short_sha }}" \
            .

      - name: Push image to Artifact Registry
        run: |
          set -euo pipefail
          docker push "${{ steps.meta.outputs.image_tag }}"

      - name: Resolve image digest
        id: digest
        run: |
          set -euo pipefail
          DIGEST="$(gcloud artifacts docker images describe "${{ steps.meta.outputs.image_tag }}" \
            --format='value(image_summary.fully_qualified_digest)' \
            --project="${{ steps.meta.outputs.project_id }}")"
          echo "fully_qualified_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "::notice::Deploy digest=${DIGEST}"

      - name: Deploy to Cloud Run (preserve existing config)
        id: deploy
        run: |
          set -euo pipefail
          # Solo --image: no pisar Cloud SQL / env / secretos de novex-backend.
          gcloud run deploy "${{ steps.meta.outputs.service_name }}" \
            --image="${{ steps.digest.outputs.fully_qualified_digest }}" \
            --region="${{ steps.meta.outputs.region }}" \
            --platform=managed \
            --project="${{ steps.meta.outputs.project_id }}" \
            --quiet

          SERVICE_URL="$(gcloud run services describe "${{ steps.meta.outputs.service_name }}" \
            --region="${{ steps.meta.outputs.region }}" \
            --project="${{ steps.meta.outputs.project_id }}" \
            --format='value(status.url)')"
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test (health)
        id: smoke
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.service_url }}/api/v1/auth/health"
          echo "::notice::Smoke GET ${URL}"
          BODY="$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${URL}")"
          echo "${BODY}" | grep -q '"status":"ok"'
          echo "result=ok" >> "$GITHUB_OUTPUT"
          echo "body=${BODY}" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Deploy Backend"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Motivo | \`${{ steps.meta.outputs.reason }}\` |"
            echo "| Servicio | \`${{ steps.meta.outputs.service_name }}\` |"
            echo "| Imagen | \`${{ steps.meta.outputs.image_tag }}\` |"
            echo "| Digest | \`${{ steps.digest.outputs.fully_qualified_digest }}\` |"
            echo "| Commit | \`${{ steps.meta.outputs.short_sha }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.service_url }} |"
            echo "| Smoke | \`${{ steps.smoke.outputs.result || 'failed' }}\` |"
            echo "| Job | \`${{ job.status }}\` |"
            echo ""
            echo "Configuración previa (Cloud SQL, variables, secretos) **preservada**."
          } >> "$GITHUB_STEP_SUMMARY"
