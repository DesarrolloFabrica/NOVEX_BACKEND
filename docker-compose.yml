# Novex Backend — entorno de desarrollo local con Docker
# Uso: cp .env.example .env  →  docker compose up -d
# NestJS corre en el host y se conecta a PostgreSQL vía localhost:${POSTGRES_PORT}

name: novex-backend

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    container_name: novex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - novex-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION:-latest}
    container_name: novex-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - novex-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  novex-network:
    name: novex-network
    driver: bridge

volumes:
  postgres_data:
    name: novex-postgres-data
  pgadmin_data:
    name: novex-pgadmin-data
