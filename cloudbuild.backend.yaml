# Cloud Build — OMEGA / Novex Backend
# Proyecto: it-fab-contenido-edu-5 (Operacion Producto y LMS) | Región: us-central1
# No incluir secretos en texto plano. No ejecutar este archivo desde el agente.
# No reutilizar Cloud SQL de producto-backend-db ni carga-lms.

substitutions:
  _REGION: us-central1
  _SERVICE: omega-backend
  _REPOSITORY: novex
  _IMAGE: omega-backend
  _CLOUD_SQL_INSTANCE: 'it-fab-contenido-edu-5:us-central1:novex-db'
  _SERVICE_ACCOUNT: '550902908078-compute@developer.gserviceaccount.com'
  _CORS_ORIGINS: 'http://localhost:5173'
  _API_PREFIX: api/v1
  _DB_HOST: '/cloudsql/it-fab-contenido-edu-5:us-central1:novex-db'
  _DB_PORT: '5432'
  _DB_USERNAME: 'novex'
  _DB_DATABASE: 'novex'
  _DB_SSL: 'false'
  _DB_SYNCHRONIZE: 'false'
  _DB_LOGGING: 'false'
  _JWT_EXPIRES_IN: 1h
  _GEMINI_MODEL: gemini-3-flash-preview
  _GOOGLE_CLIENT_ID: '550902908078-biqvngn6c1eufs3occ54cnritqrfhvl5.apps.googleusercontent.com'
  _INSTANCE_CONNECTION_NAME: 'it-fab-contenido-edu-5:us-central1:novex-db'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '5'
  _MEMORY: 1Gi
  _CPU: '1'
  _CONCURRENCY: '40'
  _TIMEOUT: '300'
  _ALLOW_UNAUTHENTICATED: 'true'

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: PushSha
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA

  - name: gcr.io/cloud-builders/docker
    id: PushLatest
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - --platform=managed
      - --execution-environment=gen2
      - --port=8080
      - --cpu=${_CPU}
      - --memory=${_MEMORY}
      - --concurrency=${_CONCURRENCY}
      - --timeout=${_TIMEOUT}
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --service-account=${_SERVICE_ACCOUNT}
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --set-secrets=DB_PASSWORD=omega-db-password:latest,JWT_SECRET=omega-jwt-secret:latest,GEMINI_API_KEY=omega-gemini-api-key:latest
      - --set-env-vars=NODE_ENV=production,API_PREFIX=${_API_PREFIX},CORS_ORIGINS=${_CORS_ORIGINS},DB_HOST=${_DB_HOST},DB_PORT=${_DB_PORT},DB_USERNAME=${_DB_USERNAME},DB_DATABASE=${_DB_DATABASE},DB_SSL=${_DB_SSL},DB_SYNCHRONIZE=${_DB_SYNCHRONIZE},DB_LOGGING=${_DB_LOGGING},INSTANCE_CONNECTION_NAME=${_INSTANCE_CONNECTION_NAME},JWT_EXPIRES_IN=${_JWT_EXPIRES_IN},GEMINI_MODEL=${_GEMINI_MODEL},GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID},CATALOG_SEED_ON_BOOT=false,DEMO_SEED_ENABLED=false
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest

timeout: 1800s
