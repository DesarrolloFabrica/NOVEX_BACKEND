# Cloud Build — NOVEX Backend
# Proyecto: it-fab-contenido-edu-5 (Operacion Producto y LMS) | Región: us-central1
# No incluir secretos en texto plano. No ejecutar este archivo desde el agente.
# No reutilizar Cloud SQL de producto-backend-db ni carga-lms.

substitutions:
  _REGION: us-central1
  _SERVICE: novex-backend
  _REPOSITORY: novex
  _IMAGE: novex-backend
  _CLOUD_SQL_INSTANCE: 'it-fab-contenido-edu-5:us-central1:novex-db'
  _SERVICE_ACCOUNT: '550902908078-compute@developer.gserviceaccount.com'
  _CORS_ORIGINS: 'http://localhost:5173,http://127.0.0.1:5173,https://novex-frontend-550902908078.us-central1.run.app,https://novex-frontend-smazwcaz4a-uc.a.run.app'
  _API_PREFIX: api/v1
  _DB_HOST: '/cloudsql/it-fab-contenido-edu-5:us-central1:novex-db'
  _DB_PORT: '5432'
  _DB_USERNAME: 'novex'
  _DB_DATABASE: 'novex'
  _DB_SSL: 'false'
  _DB_SYNCHRONIZE: 'false'
  _DB_LOGGING: 'false'
  _JWT_EXPIRES_IN: 1h
  _GEMINI_MODEL: gemini-3-flash-preview
  _GOOGLE_CLIENT_ID: '550902908078-biqvngn6c1eufs3occ54cnritqrfhvl5.apps.googleusercontent.com'
  _INSTANCE_CONNECTION_NAME: 'it-fab-contenido-edu-5:us-central1:novex-db'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '5'
  _MEMORY: 1Gi
  _CPU: '1'
  _CONCURRENCY: '40'
  _TIMEOUT: '300'

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: ValidateConfig
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ -z "${_CORS_ORIGINS}" || "${_CORS_ORIGINS}" != *"https://novex-frontend-"* ]]; then
          echo "ERROR: _CORS_ORIGINS debe incluir el frontend NOVEX desplegado"
          exit 1
        fi
        if [[ "${_REPOSITORY}" != "novex" || "${_SERVICE}" != "novex-backend" ]]; then
          echo "ERROR: servicio y repositorio deben pertenecer exclusivamente a NOVEX"
          exit 1
        fi

  - name: gcr.io/cloud-builders/docker
    id: Build
    waitFor: ['ValidateConfig']
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: PushSha
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA

  - name: gcr.io/cloud-builders/docker
    id: PushLatest
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - --platform=managed
      - --execution-environment=gen2
      - --port=8080
      - --command=
      - --args=
      - --cpu-boost
      - --startup-probe=httpGet.path=/health/ready,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=3,periodSeconds=5,failureThreshold=48
      - --liveness-probe=httpGet.path=/health,httpGet.port=8080,timeoutSeconds=3,periodSeconds=10,failureThreshold=3
      - --cpu=${_CPU}
      - --memory=${_MEMORY}
      - --concurrency=${_CONCURRENCY}
      - --timeout=${_TIMEOUT}
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --service-account=${_SERVICE_ACCOUNT}
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --set-secrets=DB_PASSWORD=novex-db-password:latest,JWT_SECRET=novex-jwt-secret:latest,GEMINI_API_KEY=novex-gemini-api-key:latest
      - --set-env-vars=^|^NODE_ENV=production|API_PREFIX=${_API_PREFIX}|CORS_ORIGINS=${_CORS_ORIGINS}|DB_HOST=${_DB_HOST}|DB_PORT=${_DB_PORT}|DB_USERNAME=${_DB_USERNAME}|DB_DATABASE=${_DB_DATABASE}|DB_SSL=${_DB_SSL}|DB_SYNCHRONIZE=${_DB_SYNCHRONIZE}|DB_LOGGING=${_DB_LOGGING}|INSTANCE_CONNECTION_NAME=${_INSTANCE_CONNECTION_NAME}|JWT_EXPIRES_IN=${_JWT_EXPIRES_IN}|GEMINI_MODEL=${_GEMINI_MODEL}|GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}|CATALOG_SEED_ON_BOOT=false|DEMO_SEED_ENABLED=false
      - --allow-unauthenticated
      - --no-traffic
      - --tag=candidate-$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Smoke
    waitFor: ['Deploy']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        CANDIDATE_TAG='candidate-$COMMIT_SHA'
        SERVICE_JSON="$(gcloud run services describe '${_SERVICE}' --project='$PROJECT_ID' --region='${_REGION}' --format=json)"
        CANDIDATE_URL="$(printf '%s' "$${SERVICE_JSON}" | python3 -c "import json,sys; tag=sys.argv[1]; data=json.load(sys.stdin); print(next((item.get('url','') for item in data.get('status',{}).get('traffic',[]) if item.get('tag') == tag), ''))" "$${CANDIDATE_TAG}")"
        if [[ -z "$${CANDIDATE_URL}" ]]; then
          echo 'ERROR: Cloud Run no publicó URL para la revisión candidata'
          exit 1
        fi
        curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$${CANDIDATE_URL}/health/ready" | grep -q '"database":"up"'
        FRONTEND_ORIGIN='https://novex-frontend-550902908078.us-central1.run.app'
        PREFLIGHT_URL="$${CANDIDATE_URL}/api/v1/situations/register-with-analysis"
        STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS \
          -H "Origin: $${FRONTEND_ORIGIN}" \
          -H 'Access-Control-Request-Method: POST' \
          -H 'Access-Control-Request-Headers: authorization,content-type' \
          "$${PREFLIGHT_URL}")"
        [[ "$${STATUS}" == '204' ]]
        curl -sS -D - -o /dev/null -X OPTIONS \
          -H "Origin: $${FRONTEND_ORIGIN}" \
          -H 'Access-Control-Request-Method: POST' \
          -H 'Access-Control-Request-Headers: authorization,content-type' \
          "$${PREFLIGHT_URL}" | grep -Fqi "access-control-allow-origin: $${FRONTEND_ORIGIN}"
        if curl -sS -D - -o /dev/null -X OPTIONS \
          -H 'Origin: https://example.invalid' \
          -H 'Access-Control-Request-Method: POST' \
          -H 'Access-Control-Request-Headers: authorization,content-type' \
          "$${PREFLIGHT_URL}" | grep -Fqi 'access-control-allow-origin'; then
          echo 'ERROR: el backend autorizó un origen externo no configurado'
          exit 1
        fi

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Promote
    waitFor: ['Smoke']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        REVISION="$(gcloud run services describe '${_SERVICE}' --project='$PROJECT_ID' --region='${_REGION}' --format='value(status.latestCreatedRevisionName)')"
        gcloud run services update-traffic '${_SERVICE}' \
          --project='$PROJECT_ID' \
          --region='${_REGION}' \
          --to-revisions="$${REVISION}=100" \
          --quiet
        SERVICE_URL="$(gcloud run services describe '${_SERVICE}' --project='$PROJECT_ID' --region='${_REGION}' --format='value(status.url)')"
        curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$${SERVICE_URL}/health/ready" | grep -q '"database":"up"'
        gcloud run services update-traffic '${_SERVICE}' \
          --project='$PROJECT_ID' \
          --region='${_REGION}' \
          --remove-tags='candidate-$COMMIT_SHA' \
          --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest

timeout: 1800s
